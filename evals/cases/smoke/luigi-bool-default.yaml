  "setup": [],
  "verification": {
    "commands": [["uv", "run", "--no-project", "--isolated", "--with", "python-dateutil", "--with", "tornado", "--with", "tenacity", "--with", "typing-extensions", "python", "-c", "import luigi; B=luigi.BoolParameter; old=B.parsing;\ntry:\n B.parsing=B.EXPLICIT_PARSING; assert B().parsing == B.EXPLICIT_PARSING; assert B(parsing=B.IMPLICIT_PARSING).parsing == B.IMPLICIT_PARSING\nfinally: B.parsing=old\nassert B().parsing == B.IMPLICIT_PARSING"]]
  }
