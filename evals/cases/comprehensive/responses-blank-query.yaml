  "setup": [],
  "verification": {
    "commands": [
      [
        "uv",
        "run",
        "--no-project",
        "--isolated",
        "--with",
        "requests",
        "--with",
        "pyyaml",
        "python",
        "-c",
        "from responses import matchers;from types import SimpleNamespace as R;m=matchers.query_string_matcher('test=1&foo=');assert not m(R(url='http://example.com?test=1'))[0];assert m(R(url='http://example.com?foo=&test=1'))[0];assert not matchers.query_string_matcher('test=1')(R(url='http://example.com?test=1&foo='))[0];assert matchers.query_string_matcher('test=1')(R(url='http://example.com?test=1'))[0];assert matchers.query_string_matcher('')(R(url='http://example.com'))[0]"
      ]
    ]
  }
