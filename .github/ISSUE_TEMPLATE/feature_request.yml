name: Feature request
description: Propose an improvement to ContextLens
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What context-measurement problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and evaluation
      description: How should the project verify that this improves results?
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: The proposal keeps the core provider-neutral.
        - label: The proposal preserves observed/predicted/verified boundaries.

