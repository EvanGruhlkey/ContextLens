name: Agent context

on:
  pull_request:
    paths:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/instructions/**"
      - ".cursor/rules/**"
      - "**/SKILL.md"
      - "**/mcp.json"
      - "**/.mcp.json"

permissions:
  contents: read

jobs:
  contextlens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: EvanGruhlkey/ContextLens@main
        with:
          mode: static
          base: ${{ github.event.pull_request.base.sha }}
          max-context-increase: "0.25"
          max-duplicate-increase: "0"
