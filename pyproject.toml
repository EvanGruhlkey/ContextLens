[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contextlens"
version = "0.1.0"
description = "CI and regression testing for AI-agent repository context"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ContextLens contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []
keywords = [
  "agents-md",
  "ai-agents",
  "coding-agents",
  "context-engineering",
  "developer-tools",
  "evaluation",
  "llm",
  "mcp",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/EvanGruhlkey/ContextLens"
Documentation = "https://github.com/EvanGruhlkey/ContextLens#readme"
Issues = "https://github.com/EvanGruhlkey/ContextLens/issues"
Repository = "https://github.com/EvanGruhlkey/ContextLens.git"

[project.scripts]
contextlens = "contextlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextlens"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/0001_normalized_contextlens.sql" = "contextlens/migrations/0001_normalized_contextlens.sql"
"schemas/context-policy.schema.json" = "contextlens/schemas/context-policy.schema.json"
"schemas/contextlens-evals.schema.json" = "contextlens/schemas/contextlens-evals.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["contextlens"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["contextlens"]
